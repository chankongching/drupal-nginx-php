user www;
worker_processes auto;
pid /var/run/nginx.pid;
worker_rlimit_nofile 65536;

events {
    worker_connections 4096;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /dev/stdout main;
    error_log /dev/stderr warn;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    keepalive_requests 1000;
    types_hash_max_size 2048;
    server_tokens off;

    client_max_body_size 128m;
    client_body_timeout 60s;
    client_header_timeout 60s;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types
        application/atom+xml
        application/javascript
        application/json
        application/ld+json
        application/manifest+json
        application/rss+xml
        application/vnd.geo+json
        application/vnd.ms-fontobject
        application/wasm
        application/x-font-ttf
        application/x-web-app-manifest+json
        application/xhtml+xml
        application/xml
        font/opentype
        image/bmp
        image/svg+xml
        image/x-icon
        text/cache-manifest
        text/css
        text/plain
        text/vcard
        text/vnd.rim.location.xloc
        text/vtt
        text/x-component
        text/x-cross-domain-policy;

    upstream php_fpm {
        server unix:/var/run/php/php-fpm.sock;
    }

    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        server_name _;

        root /var/www/html;
        index index.php index.html;

        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        location = /healthz {
            access_log off;
            add_header Content-Type text/plain;
            return 204;
        }

        location = /favicon.ico {
            access_log off;
            log_not_found off;
        }

        location = /robots.txt {
            access_log off;
            log_not_found off;
        }

        # Prevent disclosure of deployment metadata and sensitive files.
        location ~* /(?:\.git|\.svn|\.hg|\.env|composer\.(?:json|lock)|web\.config|ht\.) {
            deny all;
            return 404;
        }

        # Drupal routes are handled by index.php only after static files are checked.
        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        location ~ ^/sites/.*/private/ {
            deny all;
            return 404;
        }

        location ~ ^/sites/.*/files/styles/ {
            try_files $uri @drupal;
            expires 7d;
            access_log off;
        }

        location ~* \.(?:css|js|gif|ico|jpg|jpeg|png|svg|webp|avif|woff2?|ttf|eot)$ {
            try_files $uri @drupal;
            expires 7d;
            access_log off;
            add_header Cache-Control "public, max-age=604800, immutable";
        }

        location ~ \.php$ {
            try_files $uri =404;

            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
            fastcgi_param DOCUMENT_ROOT $realpath_root;
            fastcgi_param HTTPS $https if_not_empty;
            fastcgi_index index.php;
            fastcgi_pass php_fpm;

            fastcgi_buffers 16 16k;
            fastcgi_buffer_size 32k;
            fastcgi_connect_timeout 30s;
            fastcgi_send_timeout 60s;
            fastcgi_read_timeout 60s;
        }

        location @drupal {
            rewrite ^ /index.php?$query_string last;
        }
    }

    # Add site-specific virtual hosts through a bind mount at this location.
    include /etc/nginx/conf.d/*.conf;
    include /etc/nginx/conf.d/vhost/*.conf;
}
